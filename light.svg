<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%" style="border-radius: 16px; background: #FFFFFF; font-family: system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif;">
  <defs>
    <!-- Background & Glass Gradients -->
    <linearGradient id="l-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    
    <linearGradient id="l-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F1F5F9" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="l-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4" />
      <stop offset="50%" stop-color="rgba(15,23,42,0.08)" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="l-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- ASCII Animated Gradient (Light Mode Optimized) -->
    <linearGradient id="l-ascii-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
      <animateTransform attributeName="gradientTransform" type="translate" values="0,0; 0,-20; 0,0" dur="6s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Soft Shadows & Glow Filters -->
    <filter id="l-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    
    <filter id="l-subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Noise Pattern -->
    <pattern id="l-noise" width="100" height="100" patternUnits="userSpaceOnUse">
      <filter id="l-noise-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0.03 0" />
      </filter>
      <rect width="100" height="100" filter="url(#l-noise-filter)" opacity="0.6" />
    </pattern>

    <!-- Clip Paths -->
    <clipPath id="l-card-clip">
      <rect width="1180" height="610" rx="16" />
    </clipPath>
    
    <!-- Scanline Mask -->
    <pattern id="l-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#0F172A" stroke-width="1" opacity="0.04" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="610" rx="16" fill="url(#l-bg)" stroke="rgba(15,23,42,0.08)" stroke-width="1" />
  
  <!-- Floating Radial Gradients (Light Ambiance) -->
  <g clip-path="url(#l-card-clip)">
    <circle cx="150" cy="150" r="220" fill="#2563EB" opacity="0.07" filter="blur(60px)">
      <animate attributeName="cx" values="150;200;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="150;120;150" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="950" cy="450" r="250" fill="#06B6D4" opacity="0.06" filter="blur(70px)">
      <animate attributeName="cx" values="950;900;950" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="450;500;450" dur="9s" repeatCount="indefinite" />
    </circle>
    <rect width="1180" height="610" fill="url(#l-noise)" />
  </g>

  <!-- ==================== LEFT SIDE (ASCII Terminal) ==================== -->
  <g transform="translate(30, 30)">
    <!-- Panel Background -->
    <rect width="415" height="550" rx="12" fill="url(#l-panel)" stroke="url(#l-border)" stroke-width="1" filter="url(#l-shadow)" />
    
    <!-- Window Header Controls -->
    <g transform="translate(20, 20)">
      <circle cx="6" cy="6" r="6" fill="#EF4444" opacity="0.8" />
      <circle cx="26" cy="6" r="6" fill="#F59E0B" opacity="0.8" />
      <circle cx="46" cy="6" r="6" fill="#10B981" opacity="0.8" />
      <text x="70" y="10" fill="#475569" font-size="11" font-family="monospace" letter-spacing="1">enrique@terminal:~</text>
    </g>

    <!-- Scanline Overlay for Terminal -->
    <rect x="1" y="35" width="413" height="514" fill="url(#l-scanlines)" pointer-events="none" rx="11" />

    <!-- Floating ASCII Art -->
    <g transform="translate(24, 70)">
      <animateTransform attributeName="transform" type="translate" values="24,70; 24,63; 24,70" dur="5s" repeatCount="indefinite" additive="sum" />
      
      <!-- Ambient Glow Behind ASCII -->
      <ellipse cx="185" cy="220" rx="130" ry="150" fill="#2563EB" opacity="0.08" filter="blur(40px)" />

      <!-- ASCII Art Lines -->
      <text font-family="monospace" font-weight="900" font-size="9" fill="url(#l-ascii-grad)" xml:space="preserve" letter-spacing="0.5">
        <tspan x="0" y="0">                  ,---.                  </tspan>
        <tspan x="0" y="13">                 / / \ \                 </tspan>
        <tspan x="0" y="26">                | |   | |                </tspan>
        <tspan x="0" y="39">                | |._.| |                </tspan>
        <tspan x="0" y="52">            _,->'     '<-._            </tspan>
        <tspan x="0" y="65">          _/.               .\_          </tspan>
        <tspan x="0" y="78">        _//   ,----------.   \\_        </tspan>
        <tspan x="0" y="91">       //    /  _,,    ,,_  \    \\       </tspan>
        <tspan x="0" y="104">      //    |  (_  \  /  _)  |    \\      </tspan>
        <tspan x="0" y="117">     ||     |    )    (    |     ||     </tspan>
        <tspan x="0" y="130">     ||     |   / ^__^ \   |     ||     </tspan>
        <tspan x="0" y="143">     ||     |  / /    \ \  |     ||     </tspan>
        <tspan x="0" y="156">      \\     \_/  \___/  \_/     //      </tspan>
        
